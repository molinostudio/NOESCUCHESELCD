<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No escuches el CD</title>
    <!-- Tipografía orgánica estilo marcador serigrafiado (fiel a la Opción 1) y fuente de reproductor -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
    <!-- Librería Tone.js para sintetizar sonidos mecánicos del Discman (Play / Motor / Eject) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #f0f0f0;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Contenedor cuadrado adaptable con perspectiva 3D: garantiza círculo 1:1 en móvil, tablet y desktop */
        #discman-container {
            position: relative;
            width: min(90vw, 90vh, 580px);
            height: min(90vw, 90vh, 580px);
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            perspective: 1300px;
        }

        /* Disco negro mate estilo serigrafía PS1 */
        #cd-disc {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                #121212 0%,
                #0a0a0a 72%,
                #141414 96%,
                #2c2c2c 100%
            );
            /* Borde exterior desgastado característico del disco */
            border: 1.5px solid rgba(185, 185, 185, 0.35);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 55px rgba(255, 255, 255, 0.04),
                inset 0 0 26px rgba(0, 0, 0, 0.98);
            overflow: hidden;
            z-index: 5;
        }

        /* Ilustración en blanco y negro alto contraste fundida como serigrafía sin cortes rectangulares */
        #cd-artwork {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-image: url('assets/images/noescuches.webp');
            /* Escala vertical completa para que el halo quede arriba, el rostro en el centro y los brazos cubran todo el disco */
            background-size: auto 92%;
            background-position: 50% 68%;
            background-repeat: no-repeat;
            filter: grayscale(100%) contrast(1.36) brightness(0.92);
            /* Funde los tonos oscuros de la foto con el negro del CD eliminando cualquier borde rectangular */
            mix-blend-mode: lighten;
            -webkit-mask-image: radial-gradient(
                circle at 50% 52%,
                #000 62%,
                rgba(0, 0, 0, 0.85) 76%,
                rgba(0, 0, 0, 0.35) 89%,
                transparent 99%
            );
            mask-image: radial-gradient(
                circle at 50% 52%,
                #000 62%,
                rgba(0, 0, 0, 0.85) 76%,
                rgba(0, 0, 0, 0.35) 89%,
                transparent 99%
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Capa de textura rayada y desgaste de tinta impresa sobre toda la superficie */
        #cd-grunge {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.55;
            mix-blend-mode: screen;
        }

        /* Aro central de policarbonato oscuro ahumado (deja ver el rostro debajo como en la Opción 1) */
        #cd-hub-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28.5%;
            height: 28.5%;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                transparent 40%,
                rgba(5, 5, 5, 0.58) 42%,
                rgba(18, 18, 18, 0.38) 68%,
                rgba(5, 5, 5, 0.72) 94%,
                rgba(150, 150, 150, 0.25) 100%
            );
            border: 1.5px solid rgba(15, 15, 15, 0.9);
            box-shadow:
                0 0 0 1px rgba(175, 175, 175, 0.22),
                inset 0 0 8px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            z-index: 8;
        }

        /* Segundo anillo interno del eje del CD */
        #cd-hub-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 19.5%;
            height: 19.5%;
            border-radius: 50%;
            border: 1.5px solid rgba(10, 10, 10, 0.92);
            box-shadow:
                0 0 0 1px rgba(165, 165, 165, 0.2),
                inset 0 0 6px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            z-index: 9;
        }

        /* Agujero central negro del CD */
        #cd-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 11.5%;
            height: 11.5%;
            border-radius: 50%;
            background: #000000;
            border: 1.5px solid rgba(145, 145, 145, 0.32);
            box-shadow: inset 0 0 8px #000, 0 0 6px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            z-index: 10;
        }

        /* SVG superpuesto con los 6 textos curvos repartidos alrededor del CD */
        #cd-tracks-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            overflow: visible;
        }

        .track-link {
            cursor: pointer;
        }

        .track-text {
            font-family: 'Pangolin', 'Patrick Hand', sans-serif;
            font-weight: 400;
            font-size: 22px;
            fill: #f2f2ee;
            letter-spacing: 0.5px;
            /* Sombra suave natural sin borde grueso de caricatura para simular tinta serigrafiada */
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 5px rgba(0, 0, 0, 0.9));
            transition: fill 0.25s ease, filter 0.25s ease;
        }

        .track-link:hover .track-text,
        .track-link:focus .track-text,
        .track-link:active .track-text {
            fill: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        }

        /* Animación de giro del CD al reproducir */
        .spinning {
            animation: spinCD 0.8s linear infinite;
        }

        @keyframes spinCD {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Tapa del Discman (acrílico oscuro translúcido que baja sobre el disco girando) */
        #discman-lid {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 35% 30%,
                rgba(40, 40, 42, 0.68),
                rgba(8, 8, 10, 0.92) 72%,
                #020202 100%
            );
            border: 2px solid #2a2a2a;
            box-shadow:
                inset 0 0 45px rgba(0, 0, 0, 0.95),
                0 20px 50px rgba(0, 0, 0, 0.9);
            transform-origin: top center;
            transform: rotateX(115deg);
            opacity: 0;
            transition: transform 1.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            pointer-events: none;
            z-index: 25;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 11%;
        }

        #discman-lid::after {
            content: "NO ESCUCHES EL CD";
            font-family: 'Courier Prime', monospace;
            font-size: clamp(9px, 2vw, 11px);
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.32);
        }

        .lid-closed {
            transform: rotateX(0deg) !important;
            opacity: 1 !important;
        }

        /* Pantalla de contenido de cada track */
        #content-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.85s ease;
            z-index: 30;
        }

        .show-content {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        #playing-status {
            color: #777;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        #playing-title {
            font-family: 'Pangolin', 'Patrick Hand', sans-serif;
            font-size: clamp(36px, 6.5vw, 54px);
            color: #f5f5f2;
            letter-spacing: 1px;
        }

        #playing-subtitle {
            margin-top: 14px;
            color: #888;
            font-size: 14px;
            max-width: 460px;
            line-height: 1.5;
        }

        #stop-btn {
            margin-top: 42px;
            padding: 12px 28px;
            background: transparent;
            color: #f5f5f2;
            border: 1px solid #555;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            letter-spacing: 2px;
            border-radius: 2px;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        #stop-btn:hover,
        #stop-btn:active {
            background: #f5f5f2;
            color: #000000;
            border-color: #f5f5f2;
        }

        /* Barra inferior sutil para control de audio y prueba de imagen local en Preview */
        #utility-bar {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 40;
            pointer-events: none;
        }

        .util-btn {
            pointer-events: auto;
            background: rgba(12, 12, 12, 0.82);
            color: #9a9a9a;
            border: 1px solid #2b2b2b;
            padding: 6px 12px;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .util-btn:hover {
            color: #ffffff;
            border-color: #666666;
        }
    </style>
</head>
<body>

    <div id="discman-container">
        <!-- Tapa del reproductor -->
        <div id="discman-lid"></div>

        <!-- Disco negro mate estilo serigrafía PS1 -->
        <div id="cd-disc">
            <!-- Imagen integrada en serigrafía monocromática -->
            <div id="cd-artwork"></div>

            <!-- Textura de rayones, borde plateado gastado y grano serigráfico -->
            <svg id="cd-grunge" viewBox="0 0 500 500" aria-hidden="true">
                <defs>
                    <filter id="ps1-grain">
                        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="14" result="noise" />
                        <feColorMatrix type="matrix" values="
                            0 0 0 0 0.88
                            0 0 0 0 0.88
                            0 0 0 0 0.88
                            0 0 0 0.16 0" />
                    </filter>
                    <clipPath id="disc-clip">
                        <circle cx="250" cy="250" r="249" />
                    </clipPath>
                </defs>
                <g clip-path="url(#disc-clip)">
                    <rect width="500" height="500" filter="url(#ps1-grain)" />
                    <!-- Aro exterior plateado/blanco desgastado alrededor de todo el perímetro -->
                    <circle cx="250" cy="250" r="247.5" fill="none" stroke="rgba(235,235,235,0.42)" stroke-width="1.5" stroke-dasharray="18 4 6 3 28 5 9 2" />
                    <circle cx="250" cy="250" r="244" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" stroke-dasharray="45 14 8 22" />
                    <!-- Rayones sutiles y marcas de desgaste en el borde oscuro -->
                    <path d="M 78 92 Q 135 50 208 32" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" fill="none" />
                    <path d="M 325 462 Q 395 430 438 378" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" fill="none" />
                    <path d="M 28 275 Q 40 342 76 394" stroke="rgba(255,255,255,0.2)" stroke-width="0.9" fill="none" />
                    <path d="M 426 112 Q 458 162 470 218" stroke="rgba(255,255,255,0.22)" stroke-width="1" fill="none" />
                    <circle cx="95" cy="74" r="1.2" fill="rgba(255,255,255,0.35)" />
                    <circle cx="412" cy="405" r="1.4" fill="rgba(255,255,255,0.3)" />
                    <circle cx="52" cy="335" r="1" fill="rgba(255,255,255,0.28)" />
                </g>
            </svg>

            <!-- Aro plástico y agujero central -->
            <div id="cd-hub-outer"></div>
            <div id="cd-hub-inner"></div>
            <div id="cd-hole"></div>

            <!-- 6 Textos curvos repartidos 360° alrededor del CD (todos orientados al derecho para máxima lectura) -->
            <svg id="cd-tracks-svg" viewBox="0 0 500 500" role="navigation" aria-label="Menú principal del CD">
                <defs>
                    <!-- Arco superior (sentido horario): para los 3 títulos de la mitad superior -->
                    <path id="arc-top" d="M 250, 462 A 212,212 0 1,1 250, 38 A 212,212 0 1,1 250, 462" />
                    <!-- Arco inferior (sentido antihorario): mantiene los 3 títulos inferiores al derecho y legibles -->
                    <path id="arc-bottom" d="M 250, 34 A 216,216 0 1,0 250, 466 A 216,216 0 1,0 250, 34" />
                </defs>

                <!-- 12:00 - Arriba al centro -->
                <g class="track-link" tabindex="0" role="button" aria-label="Teaser" onclick="playTrack('Teaser')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="50%" text-anchor="middle">Teaser</textPath>
                    </text>
                </g>

                <!-- 10:00 - Arriba a la izquierda -->
                <g class="track-link" tabindex="0" role="button" aria-label="Peter Pank" onclick="playTrack('Peter Pank')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="31.5%" text-anchor="middle">Peter Pank</textPath>
                    </text>
                </g>

                <!-- 02:00 - Arriba a la derecha -->
                <g class="track-link" tabindex="0" role="button" aria-label="Literatura" onclick="playTrack('Literatura')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="68.5%" text-anchor="middle">Literatura</textPath>
                    </text>
                </g>

                <!-- 08:00 - Abajo a la izquierda -->
                <g class="track-link" tabindex="0" role="button" aria-label="Fanzines" onclick="playTrack('Fanzines')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="31.5%" text-anchor="middle">Fanzines</textPath>
                    </text>
                </g>

                <!-- 04:00 - Abajo a la derecha -->
                <g class="track-link" tabindex="0" role="button" aria-label="Música" onclick="playTrack('Música')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="68.5%" text-anchor="middle">Música</textPath>
                    </text>
                </g>

                <!-- 06:00 - Abajo al centro -->
                <g class="track-link" tabindex="0" role="button" aria-label="No escuches el CD - Film" onclick="playTrack('No escuches el CD - Film')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="50%" text-anchor="middle">No escuches el CD - Film</textPath>
                    </text>
                </g>
            </svg>
        </div>
    </div>

    <!-- Controles discretos: prueba de imagen local para el Preview y silenciador de audio -->
    <div id="utility-bar">
        <label class="util-btn" for="local-img-input" title="Carga tu imagen local para verla en esta vista previa">
            + PROBAR IMAGEN LOCAL
            <input type="file" id="local-img-input" accept="image/*" style="display: none;">
        </label>
        <button id="audio-toggle-btn" class="util-btn" onclick="toggleAudio()">🔊 SONIDO: ON</button>
    </div>

    <!-- Pantalla de contenido al abrir un track -->
    <div id="content-screen">
        <p id="playing-status">▶ TRACK EN REPRODUCCIÓN</p>
        <h1 id="playing-title">Teaser</h1>
        <p id="playing-subtitle">Aquí desplegaremos el contenido interactivo de esta sección.</p>
        <button id="stop-btn" onclick="stopDisc()">◼ EJECT</button>
    </div>

    <script>
        const cd = document.getElementById('cd-disc');
        const cdArtwork = document.getElementById('cd-artwork');
        const lid = document.getElementById('discman-lid');
        const contentScreen = document.getElementById('content-screen');
        const playingTitle = document.getElementById('playing-title');
        const audioToggleBtn = document.getElementById('audio-toggle-btn');
        const localImgInput = document.getElementById('local-img-input');
        let isTransitioning = false;
        let audioMuted = false;

        // ==========================================
        // SINTETIZADOR DE SONIDOS DEL DISCMAN (Tone.js)
        // ==========================================
        const DiscmanAudio = {
            initialized: false,

            async init() {
                if (this.initialized || typeof Tone === 'undefined') return;
                try {
                    await Tone.start();
                    this.initialized = true;
                } catch (e) {
                    // El navegador puede requerir interacción directa antes de iniciar audio
                }
            },

            // Sonido al presionar Play: clic mecánico + aceleración de motor + lectura láser + cierre de tapa
            async playSequence() {
                if (audioMuted || typeof Tone === 'undefined') return;
                await this.init();
                const now = Tone.now();

                // 1. Clic físico del botón Play
                const clickNoise = new Tone.NoiseSynth({
                    noise: { type: 'white' },
                    envelope: { attack: 0.001, decay: 0.025, sustain: 0, release: 0.01 }
                }).toDestination();
                clickNoise.volume.value = -10;
                clickNoise.triggerAttackRelease('32n', now);

                const buttonThud = new Tone.MembraneSynth({
                    pitchDecay: 0.02,
                    octaves: 3,
                    envelope: { attack: 0.001, decay: 0.06, sustain: 0, release: 0.02 }
                }).toDestination();
                buttonThud.volume.value = -12;
                buttonThud.triggerAttackRelease('C2', '32n', now);

                // 2. Motor girando y tomando velocidad (barrido ascendente)
                const motorFilter = new Tone.Filter(320, 'lowpass').toDestination();
                const motorGain = new Tone.Gain(0.001).connect(motorFilter);
                const motorOsc = new Tone.Oscillator({
                    type: 'sawtooth',
                    frequency: 85
                }).connect(motorGain);

                motorOsc.start(now + 0.06);
                motorGain.gain.exponentialRampToValueAtTime(0.08, now + 0.35);
                motorOsc.frequency.exponentialRampToValueAtTime(390, now + 1.45);
                motorGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.9);
                motorOsc.stop(now + 1.95);

                // 3. Pulsos sutiles del lente láser leyendo la pista del CD
                const laserFilter = new Tone.Filter(2400, 'bandpass').toDestination();
                const laserPulse = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.035, sustain: 0, release: 0.01 }
                }).connect(laserFilter);
                laserPulse.volume.value = -18;
                laserPulse.triggerAttackRelease('32n', now + 0.35);
                laserPulse.triggerAttackRelease('32n', now + 0.52);
                laserPulse.triggerAttackRelease('32n', now + 0.78);

                // 4. Golpe seco de la tapa acrílica al cerrarse
                const lidSnap = new Tone.NoiseSynth({
                    noise: { type: 'brown' },
                    envelope: { attack: 0.002, decay: 0.07, sustain: 0, release: 0.02 }
                }).toDestination();
                lidSnap.volume.value = -8;
                lidSnap.triggerAttackRelease('16n', now + 1.35);

                // Limpieza de nodos tras finalizar
                setTimeout(() => {
                    clickNoise.dispose();
                    buttonThud.dispose();
                    motorOsc.dispose();
                    motorGain.dispose();
                    motorFilter.dispose();
                    laserPulse.dispose();
                    laserFilter.dispose();
                    lidSnap.dispose();
                }, 2200);
            },

            // Sonido al presionar Eject: traba mecánica + frenado del disco + apertura de tapa
            async ejectSequence() {
                if (audioMuted || typeof Tone === 'undefined') return;
                await this.init();
                const now = Tone.now();

                // 1. Liberación metálica del botón Eject
                const latchClick = new Tone.NoiseSynth({
                    noise: { type: 'white' },
                    envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 }
                }).toDestination();
                latchClick.volume.value = -9;
                latchClick.triggerAttackRelease('32n', now);

                // 2. Motor frenando (barrido descendente)
                const brakeFilter = new Tone.Filter(280, 'lowpass').toDestination();
                const brakeGain = new Tone.Gain(0.07).connect(brakeFilter);
                const brakeOsc = new Tone.Oscillator({
                    type: 'triangle',
                    frequency: 340
                }).connect(brakeGain);

                brakeOsc.start(now + 0.03);
                brakeOsc.frequency.exponentialRampToValueAtTime(52, now + 0.95);
                brakeGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
                brakeOsc.stop(now + 1.05);

                // 3. Resorte de apertura de la tapa
                const lidPop = new Tone.MembraneSynth({
                    pitchDecay: 0.04,
                    octaves: 2,
                    envelope: { attack: 0.002, decay: 0.09, sustain: 0, release: 0.03 }
                }).toDestination();
                lidPop.volume.value = -11;
                lidPop.triggerAttackRelease('G2', '16n', now + 0.55);

                setTimeout(() => {
                    latchClick.dispose();
                    brakeOsc.dispose();
                    brakeGain.dispose();
                    brakeFilter.dispose();
                    lidPop.dispose();
                }, 1400);
            }
        };

        function toggleAudio() {
            audioMuted = !audioMuted;
            audioToggleBtn.innerText = audioMuted ? '🔇 SONIDO: OFF' : '🔊 SONIDO: ON';
            if (!audioMuted) {
                DiscmanAudio.init();
            }
        }

        // Permite cargar una imagen local directamente en el Preview
        localImgInput.addEventListener('change', (event) => {
            const file = event.target.files?.[0];
            if (!file || !cdArtwork) return;
            const objectUrl = URL.createObjectURL(file);
            cdArtwork.innerHTML = '';
            cdArtwork.style.backgroundImage = `url('${objectUrl}')`;
        });

        // Busca la imagen en la carpeta assets/images/ (ideal para GitHub) y usa un halo guía si aún no está subida
        (function ensureArtworkLoads() {
            if (!cdArtwork) return;
            const candidates = [
                'assets/images/noescuches.webp',
                'assets/images/noescuches_2.webp',
                'img/noescuches.webp',
                'noescuches_2.webp',
                'noescuches.webp'
            ];
            let index = 0;

            function showSandboxFallback() {
                if (!cdArtwork) return;
                cdArtwork.style.backgroundImage = 'none';
                cdArtwork.innerHTML = `
                    <svg viewBox="0 0 500 500" width="100%" height="100%" aria-hidden="true">
                        <circle cx="250" cy="215" r="105" fill="#e6e6e2" opacity="0.88" />
                        <circle cx="250" cy="215" r="105" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />
                    </svg>
                `;
            }

            function tryNext() {
                if (index >= candidates.length) {
                    showSandboxFallback();
                    return;
                }
                const img = new Image();
                const currentSrc = candidates[index++];
                img.onload = () => {
                    if (!cdArtwork) return;
                    cdArtwork.innerHTML = '';
                    cdArtwork.style.backgroundImage = `url('${currentSrc}')`;
                };
                img.onerror = tryNext;
                img.src = currentSrc;
            }

            tryNext();
        })();

        // Soporte de teclado (Enter / Espacio) en los enlaces SVG
        document.querySelectorAll('.track-link').forEach((item) => {
            item.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const label = item.getAttribute('aria-label');
                    if (label) playTrack(label);
                }
            });
        });

        function playTrack(trackName) {
            if (isTransitioning) return;
            isTransitioning = true;

            // Dispara el sonido mecánico de Play + motor + cierre de tapa
            DiscmanAudio.playSequence();

            // 1. El CD comienza a girar
            cd.classList.add('spinning');

            // 2. Baja la tapa acrílica del Discman
            setTimeout(() => {
                lid.classList.add('lid-closed');
            }, 400);

            // 3. Muestra la sección elegida
            playingTitle.innerText = trackName;

            setTimeout(() => {
                contentScreen.classList.add('show-content');
                isTransitioning = false;
            }, 1850);
        }

        function stopDisc() {
            if (isTransitioning) return;
            isTransitioning = true;

            // Dispara el sonido mecánico de Eject + frenado del disco
            DiscmanAudio.ejectSequence();

            contentScreen.classList.remove('show-content');

            setTimeout(() => {
                lid.classList.remove('lid-closed');

                setTimeout(() => {
                    cd.classList.remove('spinning');
                    isTransitioning = false;
                }, 850);
            }, 550);
        }
    </script>
</body>
</html>
