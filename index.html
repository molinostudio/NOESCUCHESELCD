<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No escuches el CD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Space Mono', monospace;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Paleta base (se reescribe con el color picker) */
            --body-base: #ff4da6;
            --body-light: #ff80bf;
            --body-dark: #b30059;
            --body-shadow: #4d0026;
        }

        /* --- BARRA VERTICAL EN EL COSTADO IZQUIERDO --- */
        #side-tools {
            position: fixed;
            left: clamp(10px, 2vw, 28px);
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(14px, 2.2vh, 22px);
            z-index: 100;
        }

        /* --- CUSTOMIZADOR DE COLOR (Ícono Esmalte de Uñas) --- */
        #theme-customizer {
            position: relative;
            width: clamp(32px, 3.5vw, 40px);
            height: clamp(32px, 3.5vw, 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.85);
            transition: transform 0.15s ease, color 0.15s ease;
        }

        #theme-customizer:hover {
            transform: scale(1.1);
            color: #fff;
        }

        #colorPicker {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .tool-icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.82);
            width: clamp(32px, 3.5vw, 40px);
            height: clamp(32px, 3.5vw, 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, color 0.15s ease, filter 0.15s ease;
            outline: none;
        }

        .tool-icon-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .tool-icon-btn.active {
            color: var(--body-light);
            filter: drop-shadow(0 0 6px var(--body-base));
            transform: scale(1.1);
        }

        /* Sub-paneles flotantes */
        .tool-popover {
            position: fixed;
            top: 50%;
            left: clamp(56px, 7vw, 88px);
            transform: translateY(-50%);
            background: rgba(14, 14, 17, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 12px 14px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 105;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .tool-popover.open { display: flex; }

        .ink-swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease;
        }

        .ink-swatch:hover, .ink-swatch.selected {
            transform: scale(1.15);
            border-color: var(--body-light);
        }

        .mini-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #eee;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .mini-action-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--body-light);
        }

        #sticker-popover {
            flex-wrap: wrap;
            max-width: min(336px, calc(100vw - 72px));
            max-height: 78dvh;
            overflow-y: auto;
            gap: 7px;
        }

        .sticker-choice {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .sticker-choice:hover {
            transform: scale(1.12);
            background: rgba(255, 255, 255, 0.13);
        }

        #sticker-controls-bar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 8px;
            margin-top: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- LAYOUT PRINCIPAL CENTRADO --- */
        #app-layout {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 20px clamp(20px, 4vw, 60px) 20px clamp(64px, 7vw, 110px);
        }

        /* --- CONTENEDOR CON PERSPECTIVA 3D --- */
        #player-section {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1600px;
            padding-top: clamp(32px, 7vh, 72px);
        }

        #discman-device {
            position: relative;
            width: clamp(270px, 38vw, 560px);
            max-height: 74dvh;
            aspect-ratio: 440 / 484;
            transform: rotateX(15deg) translateY(-10px);
            transform-style: preserve-3d;
            filter: drop-shadow(0 35px 45px rgba(0, 0, 0, 0.95));
        }

        #device-base-svg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        #cd-chamber {
            position: absolute;
            top: 7%; left: 50%; transform: translateX(-50%);
            width: 82.5%; aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle, #141416 55%, #070708 100%);
            box-shadow: inset 0 6px 18px rgba(0, 0, 0, 1), 0 0 0 2px rgba(255, 255, 255, 0.06);
            z-index: 5;
        }

        #cd-disc {
            position: absolute; inset: 2%; border-radius: 50%;
            background: conic-gradient(
                from 25deg at 50% 50%,
                rgba(215, 218, 224, 0.95) 0deg, rgba(255, 255, 255, 0.98) 28deg,
                rgba(135, 228, 255, 0.88) 52deg, rgba(182, 148, 255, 0.85) 74deg,
                rgba(255, 140, 210, 0.85) 95deg, rgba(255, 218, 128, 0.9) 115deg,
                rgba(225, 228, 232, 0.96) 142deg, rgba(185, 190, 196, 0.95) 180deg,
                rgba(250, 252, 255, 0.98) 212deg, rgba(130, 238, 212, 0.86) 238deg,
                rgba(138, 175, 255, 0.88) 262deg, rgba(245, 150, 235, 0.85) 286deg,
                rgba(255, 238, 150, 0.9) 308deg, rgba(205, 208, 214, 0.95) 336deg,
                rgba(215, 218, 224, 0.95) 360deg
            );
            border: 2px solid rgba(155, 160, 168, 0.85);
            box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.35), inset 0 0 3px rgba(255, 255, 255, 0.8), 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 6;
        }

        #cd-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 28%; height: 28%; border-radius: 50%;
            background: radial-gradient(circle, rgba(232,232,230,0.94) 0%, rgba(222,222,220,0.9) 62%, rgba(165,168,172,0.92) 66%, rgba(236,236,235,0.88) 70%, rgba(195,198,202,0.85) 94%, rgba(120,124,130,0.9) 100%);
            border: 1.5px solid rgba(140, 144, 150, 0.8);
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.7);
            z-index: 10; pointer-events: none;
        }

        #cd-hole {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 11.5%; height: 11.5%; border-radius: 50%;
            background: #141416; border: 2.5px solid rgba(190, 192, 196, 0.9);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.95);
            z-index: 12; pointer-events: none;
        }

        .spinning { animation: spinCD 0.8s linear infinite; }
        @keyframes spinCD { 100% { transform: rotate(360deg); } }

        #discman-lid {
            position: absolute; inset: 0; width: 100%; height: 100%;
            transform-origin: 50% 2%; transform-style: preserve-3d;
            transform: rotateX(102deg); transition: transform 1.2s cubic-bezier(0.3, 0, 0.1, 1);
            pointer-events: none; z-index: 20;
        }

        .lid-closed { transform: rotateX(0deg) !important; }

        .lid-face-outer {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            transform: translateZ(3px);
        }

        .lid-face-inner {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            transform: rotateX(180deg) translateZ(1px);
        }

        .lid-svg-outer, .lid-svg-inner { position: absolute; inset: 0; width: 100%; height: 100%; }
        .lid-svg-outer { filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.65)); }

        #sharpie-hit-surface { pointer-events: none; cursor: crosshair; touch-action: none; }
        #discman-lid.lid-closed.sharpie-active #sharpie-hit-surface { pointer-events: all; }
        #discman-lid.lid-closed .lid-sticker-item { pointer-events: all; cursor: grab; touch-action: none; }
        #discman-lid.lid-closed .lid-sticker-item:active { cursor: grabbing; }

        /* --- BISEL INFERIOR: 1, 2, 3 (IZQ) | ▲ EJECT (CENTRO) | 4, 5, 6 (DER) --- */
        #control-deck { position: absolute; inset: 0; pointer-events: none; z-index: 25; transform: translateZ(5px); }
        #bezel-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

        .hw-btn {
            position: absolute; pointer-events: auto;
            height: clamp(19px, 2.35vw, 26px);
            min-width: clamp(25px, 3vw, 34px);
            padding: 0 clamp(6px, 0.8vw, 10px);
            border-radius: 999px;
            background: radial-gradient(circle at 50% 25%, #f5f5f7 0%, #c4c4ca 62%, #8e8e95 100%);
            border: 1px solid #161618; outline: none;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), 0 3px 6px rgba(0, 0, 0, 0.95), 0 0 0 2.2px #09090b;
            color: #141416; font-family: Arial, sans-serif; font-size: clamp(9px, 1vw, 12px); font-weight: 900; letter-spacing: 0.3px;
            font-variant-emoji: text;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s ease;
        }
        .hw-btn:hover { filter: brightness(1.08); }
        .hw-btn:active { box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.65), 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 0 2.2px #09090b; }
        .hw-btn.active-track {
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), 0 0 10px var(--body-light), 0 0 0 2.2px var(--body-base);
        }

        /* Izquierda: 1, 2, 3 */
        #btn-track-1 { left: 19.5%; top: 82.9%; transform: translate(-50%, -50%) rotate(35deg); }
        #btn-track-2 { left: 29.0%; top: 87.9%; transform: translate(-50%, -50%) rotate(22deg); }
        #btn-track-3 { left: 39.2%; top: 90.9%; transform: translate(-50%, -50%) rotate(10deg); }

        /* Centro: ▲ Eject */
        #btn-eject {
            left: 50.0%; top: 91.8%;
            transform: translate(-50%, -50%);
            min-width: clamp(32px, 3.8vw, 44px);
            padding: 0 clamp(10px, 1.2vw, 15px);
        }

        /* Derecha: 4, 5, 6 */
        #btn-track-4 { left: 60.8%; top: 90.9%; transform: translate(-50%, -50%) rotate(-10deg); }
        #btn-track-5 { left: 71.0%; top: 87.9%; transform: translate(-50%, -50%) rotate(-22deg); }
        #btn-track-6 { left: 80.5%; top: 82.9%; transform: translate(-50%, -50%) rotate(-35deg); }

        /* --- POP-UP TRANSLÚCIDO CON MICRO-PÍXELES EN DEGRADÉ Y CONSTELACIÓN TITILANTE --- */
        #module-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 44px);
            background: rgba(5, 5, 8, 0.30);
            backdrop-filter: blur(2.5px);
            -webkit-backdrop-filter: blur(2.5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease;
        }

        #module-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #module-section {
            position: relative;
            width: min(90vw, 720px);
            max-height: 82dvh;
            border-radius: 16px;
            padding: clamp(22px, 3vw, 38px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Base translúcida dejando ver el Discman girando detrás */
            background: rgba(10, 9, 16, 0.56);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            border: 1.5px solid var(--body-light);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.85),
                0 0 26px var(--body-base),
                inset 0 0 22px rgba(255, 255, 255, 0.14);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        #module-overlay.active #module-section {
            transform: scale(1) translateY(0);
        }

        /* Canvas de micro-píxeles en degradé + constelación y estrellas titilantes */
        #popup-fx-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Velo sutil central para legibilidad nítida sin tapar los bordes de píxeles y estrellas */
        .popup-readability-veil {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(
                ellipse at 50% 50%,
                rgba(7, 7, 11, 0.54) 0%,
                rgba(7, 7, 11, 0.34) 68%,
                rgba(7, 7, 11, 0.12) 100%
            );
        }

        /* Cabecera del Pop-up */
        .popup-header {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.26);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .popup-title-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #module-track-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--body-light);
            opacity: 0.95;
        }

        #module-title {
            font-size: clamp(21px, 2.5vw, 34px);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 12px var(--body-base);
        }

        #btn-close-popup {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(12, 11, 18, 0.55);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        #btn-close-popup:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--body-light);
        }

        /* Cuerpo desplazable del Pop-up */
        #module-content {
            position: relative;
            z-index: 3;
            flex: 1;
            color: #f4f4f8;
            font-size: clamp(13px, 1.1vw, 16px);
            line-height: 1.72;
            overflow-y: auto;
            padding-right: 8px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        #module-content::-webkit-scrollbar { width: 5px; }
        #module-content::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        #module-content::-webkit-scrollbar-thumb {
            background: var(--body-light);
            border-radius: 4px;
        }
        #module-content p { margin-bottom: 16px; }

        /* Barra inferior de controles dentro del Pop-up: ◀◀  ■  ▶▶ */
        .popup-transport-bar {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
        }

        .popup-ctrl-btn {
            height: 32px;
            min-width: 48px;
            padding: 0 14px;
            border-radius: 999px;
            background: radial-gradient(circle at 50% 25%, #f5f5f7 0%, #c4c4ca 62%, #8e8e95 100%);
            border: 1px solid #161618;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), 0 3px 8px rgba(0, 0, 0, 0.85), 0 0 0 2px #09090b;
            color: #141416;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 900;
            font-variant-emoji: text;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .popup-ctrl-btn:hover {
            filter: brightness(1.08);
            transform: scale(1.06);
        }

        .popup-ctrl-btn:active {
            transform: scale(0.97);
        }

        /* Estilos específicos para contenido interno de módulos */
        .module-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.25); }
        .module-link-btn {
            display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 6px;
            border: 1px solid var(--body-light); background: rgba(15, 14, 24, 0.55); color: #ffffff; text-decoration: none;
            font-size: 13px; font-weight: 700; letter-spacing: 0.5px; transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
        }
        .module-link-btn:hover {
            background: var(--body-base);
            color: #050505;
            box-shadow: 0 0 14px var(--body-base);
        }
        
        .book-item { display: flex; gap: 20px; margin-bottom: 30px; align-items: flex-start; }
        .book-cover {
            flex: 0 0 120px; width: 120px; height: 176px; border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.75); object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .book-info h3 { color: #ffffff; font-size: 18px; margin-bottom: 10px; text-shadow: 0 0 10px var(--body-base); }

        /* Estilos del Teaser interactivo */
        .teaser-link {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
            margin-bottom: 20px;
            background: #000;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .teaser-link:hover {
            border-color: var(--body-light);
            box-shadow: 0 0 18px var(--body-base);
        }
        .teaser-still {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .teaser-link:hover .teaser-still {
            transform: scale(1.05);
        }
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        .teaser-link:hover .play-overlay {
            background: rgba(0, 0, 0, 0.15);
        }
        .play-icon {
            width: 64px;
            height: 64px;
            fill: #ffffff;
            filter: drop-shadow(0 0 12px var(--body-base));
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .teaser-link:hover .play-icon {
            transform: scale(1.15);
        }

        /* --- ADAPTACIÓN PARA CELULARES Y TABLETS --- */
        @media (max-width: 900px) and (orientation: portrait) {
            #app-layout {
                padding: 16px 14px 16px 56px;
            }
            #player-section {
                padding-top: clamp(56px, 11dvh, 105px);
            }
            #discman-device {
                width: min(74vw, 350px);
                max-height: 56dvh;
                transform: rotateX(12deg);
            }
            #module-section {
                width: 92vw;
                max-height: 78dvh;
                padding: 18px;
            }
            #module-title {
                font-size: 21px;
            }
            #module-content {
                font-size: 13px;
            }
            .book-item { flex-direction: column; gap: 12px; }
            .book-cover { width: 110px; height: 162px; flex: 0 0 auto; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            #app-layout {
                padding: 12px 16px 12px 58px;
            }
            #player-section {
                padding-top: 34px;
            }
            #discman-device {
                width: min(38vw, 270px);
                max-height: 76dvh;
                transform: rotateX(12deg);
            }
            #module-section {
                width: min(84vw, 620px);
                max-height: 84dvh;
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <div id="side-tools">
        <!-- 1. Selector de color (Ícono Esmalte de uñas) -->
        <div id="theme-customizer" title="Cambiar color del Discman">
            <input type="color" id="colorPicker" value="#ff4da6">
            <svg viewBox="0 0 36 36" width="24" height="24" style="pointer-events: none;">
                <path d="M14.5 3.5 H21.5 L20.5 13.5 H15.5 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                <line x1="15.5" y1="8.5" x2="20.5" y2="8.5" stroke="currentColor" stroke-width="1.4" />

        let currentTrackIndex = 0;

        const cd = document.getElementById('cd-disc');

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, c => ('0'+Math.min(255, Math.max(0, parseInt(c, 16) + amount)).toString(16)).substr(-2));
        }

        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            const num = parseInt(clean, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

            document.body.style.setProperty('--body-dark', adjustColor(hex, -65));

        /* =========================================================
           MOTOR CANVAS: MICRO-PÍXELES EN DEGRADÉ + CONSTELACIÓN TITILANTE
           ========================================================= */
        const fxCanvas = document.getElementById('popup-fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let fxAnimId = null;

        // Nodos de constelación (coordenadas normalizadas 0..1)
        const constellationGroups = [
            [
                { x: 0.08, y: 0.14 },
                { x: 0.17, y: 0.08 },
                { x: 0.25, y: 0.17 },
                { x: 0.34, y: 0.10 }
            ],
            [
                { x: 0.68, y: 0.11 },
                { x: 0.79, y: 0.18 },
                { x: 0.90, y: 0.12 },
                { x: 0.85, y: 0.26 }
            ],
            [
                { x: 0.10, y: 0.82 },
                { x: 0.20, y: 0.90 },
                { x: 0.31, y: 0.84 }
            ],
            [
                { x: 0.67, y: 0.87 },
                { x: 0.78, y: 0.81 },
                { x: 0.91, y: 0.89 }
            ]
        ];

        // Estrellas muy pequeñas que titilan con fases y velocidades independientes
        const starField = Array.from({ length: 34 }, (_, i) => {
            // Algunas coinciden con nodos de constelación y otras flotan alrededor
            const flatNodes = constellationGroups.flat();
            if (i < flatNodes.length) {
                return {
                    x: flatNodes[i].x,
                    y: flatNodes[i].y,
                    phase: (i * 1.37) % (Math.PI * 2),
                    speed: 0.0018 + (i % 5) * 0.00045,
                    flare: i % 2 === 0
                };
            }
            const seed = (i * 9301 + 49297) % 233280;
            const seed2 = (i * 4253 + 17389) % 233280;
            return {
                x: (seed / 233280) * 0.94 + 0.03,
                y: (seed2 / 233280) * 0.92 + 0.04,
                phase: (i * 2.13) % (Math.PI * 2),
                speed: 0.0015 + (i % 7) * 0.0004,
                flare: i % 3 === 0
            };
        });

        function renderPopupFx(time) {
            const rect = moduleSection.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
                fxAnimId = requestAnimationFrame(renderPopupFx);
                return;
            }

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const targetW = Math.round(rect.width * dpr);
            const targetH = Math.round(rect.height * dpr);
            if (fxCanvas.width !== targetW || fxCanvas.height !== targetH) {
                fxCanvas.width = targetW;
                fxCanvas.height = targetH;
            }

            fxCtx.save();
            fxCtx.scale(dpr, dpr);
            const w = rect.width;
            const h = rect.height;
            fxCtx.clearRect(0, 0, w, h);

            const styles = getComputedStyle(document.body);
            const baseHex = styles.getPropertyValue('--body-base').trim() || '#ff4da6';
            const lightHex = styles.getPropertyValue('--body-light').trim() || '#ff80bf';
            const darkHex = styles.getPropertyValue('--body-dark').trim() || '#b30059';

            const cBase = hexToRgb(baseHex);
            const cLight = hexToRgb(lightHex);
            const cDark = hexToRgb(darkHex);

            // 1. Matriz fina de micro-píxeles circulares en degradé sincronizada al color del Discman
            const step = 4.6;
            const radius = 1.45;
            const cols = Math.ceil(w / step);
            const rows = Math.ceil(h / step);

            for (let r = 0; r < rows; r++) {
                const ny = r / Math.max(1, rows - 1);
                for (let c = 0; c < cols; c++) {
                    const nx = c / Math.max(1, cols - 1);
                    // Degradé diagonal + centro luminoso tipo lentejuela / LED
                    const diag = (nx * 0.6 + ny * 0.4);
                    const distCenter = Math.hypot(nx - 0.52, ny - 0.45);
                    const lum = Math.max(0, Math.min(1, 1 - distCenter * 1.15));

                    // Brillo sutil por celda tipo mosaico
                    const cellHash = ((r * 73 + c * 151) % 17) / 17;
                    const shimmer = 0.78 + 0.22 * Math.sin(time * 0.0014 + cellHash * Math.PI * 2);

                    let pr, pg, pb;
                    if (lum > 0.55) {
                        const t = (lum - 0.55) / 0.45;
                        pr = Math.round(cBase.r + (cLight.r - cBase.r) * t);
                        pg = Math.round(cBase.g + (cLight.g - cBase.g) * t);
                        pb = Math.round(cBase.b + (cLight.b - cBase.b) * t);
                    } else {
                        const t = diag;
                        pr = Math.round(cDark.r + (cBase.r - cDark.r) * t);
                        pg = Math.round(cDark.g + (cBase.g - cDark.g) * t);
                        pb = Math.round(cDark.b + (cBase.b - cDark.b) * t);
                    }

                    const alpha = (0.20 + lum * 0.28) * shimmer;
                    fxCtx.fillStyle = `rgba(${pr}, ${pg}, ${pb}, ${alpha.toFixed(3)})`;
                    fxCtx.beginPath();
                    fxCtx.arc(c * step + step * 0.5, r * step + step * 0.5, radius, 0, Math.PI * 2);
                    fxCtx.fill();
                }
            }

            // 2. Líneas sutiles de constelación con desplazamiento mínimo
            const driftX = Math.sin(time * 0.00035) * 4;
            const driftY = Math.cos(time * 0.0003) * 3;

            fxCtx.save();
            fxCtx.strokeStyle = `rgba(${cLight.r}, ${cLight.g}, ${cLight.b}, 0.22)`;
            fxCtx.lineWidth = 0.75;
            fxCtx.setLineDash([2, 3]);
            constellationGroups.forEach(group => {
                fxCtx.beginPath();
                group.forEach((pt, idx) => {
                    const px = pt.x * w + driftX;
                    const py = pt.y * h + driftY;
                    if (idx === 0) fxCtx.moveTo(px, py);
                    else fxCtx.lineTo(px, py);
                });
                fxCtx.stroke();
            });
            fxCtx.restore();

            // 3. Estrellas muy pequeñas prendiendo y apagando (destellos sutiles)
            starField.forEach(star => {
                const wave = (Math.sin(time * star.speed + star.phase) + 1) * 0.5;
                const intensity = Math.pow(wave, 2.4); // Encendido suave y puntual
                if (intensity < 0.05) return;

                const sx = star.x * w + driftX;
                const sy = star.y * h + driftY;

                // Halo suave del color claro del Discman
                const glowR = star.flare ? 7.5 : 4;
                const grad = fxCtx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
                grad.addColorStop(0, `rgba(255, 255, 255, ${(0.95 * intensity).toFixed(3)})`);
                grad.addColorStop(0.45, `rgba(${cLight.r}, ${cLight.g}, ${cLight.b}, ${(0.55 * intensity).toFixed(3)})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                fxCtx.fillStyle = grad;
                fxCtx.beginPath();
                fxCtx.arc(sx, sy, glowR, 0, Math.PI * 2);
                fxCtx.fill();

                // Destello en cruz muy fino para las estrellas principales
                if (star.flare && intensity > 0.35) {
                    const arm = 4.2 * intensity;
                    fxCtx.strokeStyle = `rgba(255, 255, 255, ${(0.85 * intensity).toFixed(3)})`;
                    fxCtx.lineWidth = 0.9;
                    fxCtx.beginPath();
                    fxCtx.moveTo(sx - arm, sy);
                    fxCtx.lineTo(sx + arm, sy);
                    fxCtx.moveTo(sx, sy - arm);
                    fxCtx.lineTo(sx, sy + arm);
                    fxCtx.stroke();
                }
            });

            fxCtx.restore();
            fxAnimId = requestAnimationFrame(renderPopupFx);
        }

        function startPopupFx() {
            if (!fxAnimId) {
                fxAnimId = requestAnimationFrame(renderPopupFx);
            }
        }

        function stopPopupFx() {

                cancelAnimationFrame(fxAnimId);
                fxAnimId = null;
            }
        }

        /* --- HERRAMIENTAS DE INTERACCIÓN --- */
        const lidSvgOuter = document.getElementById('lid-svg-outer');

        const sharpieCanvas = document.createElement('canvas');
        sharpieCanvas.width = 880;
        sharpieCanvas.height = 968;

        sCtx.scale(2, 2); sCtx.lineCap = 'round'; sCtx.lineJoin = 'round';

        function createStickerNode(innerSvg, x = 220, y = 175, angle = 0) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'lid-sticker-item');
            g.dataset.x = x; g.dataset.y = y; g.dataset.angle = angle;
            g.setAttribute('transform', `translate(${x}, ${y}) rotate(${angle})`);
            g.style.filter = 'drop-shadow(0 2px 3px rgba(0,0,0,0.65))';
            g.innerHTML = innerSvg + `<circle class="sticker-sel-ring" cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" style="display:none; pointer-events:none;"/>`;

            g.addEventListener('pointerdown', (e) => {
                if (activeTool === 'sharpie') return;
                e.stopPropagation(); stickersLayer.appendChild(g); selectStickerElement(g); draggingSticker = g; g.setPointerCapture(e.pointerId);
                const pt = clientToSvgPoint(e.clientX, e.clientY); dragOffset.x = pt.x - parseFloat(g.dataset.x); dragOffset.y = pt.y - parseFloat(g.dataset.y);
            });

            g.addEventListener('pointermove', (e) => {
                if (draggingSticker !== g) return;
                const pt = clientToSvgPoint(e.clientX, e.clientY);
                const nx = Math.max(22, Math.min(418, pt.x - dragOffset.x)); const ny = Math.max(20, Math.min(395, pt.y - dragOffset.y));
                g.dataset.x = nx; g.dataset.y = ny; g.setAttribute('transform', `translate(${nx}, ${ny}) rotate(${g.dataset.angle})`);
            });
            g.addEventListener('pointerup', () => { draggingSticker = null; });
            stickersLayer.appendChild(g); selectStickerElement(g);
        }

        function selectStickerElement(node) {
            document.querySelectorAll('.sticker-sel-ring').forEach(r => r.style.display = 'none');
            selectedSticker = node;
            if (node) { const ring = node.querySelector('.sticker-sel-ring'); if (ring) ring.style.display = 'block'; }
        }

        function addPresetSticker(key) {
            lid.classList.add('lid-closed');
            const jitterX = 220 + (Math.random() * 70 - 35); const jitterY = 175 + (Math.random() * 60 - 30); const jitterAngle = Math.round(Math.random() * 26 - 13);
            createStickerNode(presetStickerMarkup[key], jitterX, jitterY, jitterAngle);
        }

        document.getElementById('stickerUploadInput').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const size = 180; const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
                    const pad = 18; const maxDim = size - pad * 2; const scale = Math.min(maxDim / img.width, maxDim / img.height);
                    const w = img.width * scale; const h = img.height * scale; const dx = (size - w) / 2; const dy = (size - h) / 2;

                    ctx.save();
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) { ctx.drawImage(img, dx + Math.cos(a) * 7, dy + Math.sin(a) * 7, w, h); }
                    ctx.globalCompositeOperation = 'source-in'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size); ctx.restore();
                    ctx.drawImage(img, dx, dy, w, h);
                    lid.classList.add('lid-closed');
                    createStickerNode(`<image href="${c.toDataURL('image/png')}" x="-26.5" y="-26.5" width="53" height="53"/>`, 220, 175, 0);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file); e.target.value = '';
        });

        function rotateSelectedSticker() {
            if (!selectedSticker) return;
            const nextAngle = (parseFloat(selectedSticker.dataset.angle) + 20) % 360;
            selectedSticker.dataset.angle = nextAngle;
            selectedSticker.setAttribute('transform', `translate(${selectedSticker.dataset.x}, ${selectedSticker.dataset.y}) rotate(${nextAngle})`);
        }
        function deleteSelectedSticker() { if (!selectedSticker) return; selectedSticker.remove(); selectedSticker = null; }
        function clearAllStickers() { stickersLayer.innerHTML = ''; selectedSticker = null; }
