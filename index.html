<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base CD - No escuches el CD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000; /* Fondo general negro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal: mantiene el círculo perfecto en cualquier pantalla */
        #cd-container {
            position: relative;
            width: min(90vw, 90vh, 600px);
            aspect-ratio: 1 / 1;
        }

        /* Base negra del CD con textura y desgaste sutil en los bordes */
        #cd-base {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #080808;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05), inset 0 0 20px rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        /* Capa que llama a tu archivo original y le aplica el efecto de la Opción 1 */
        #cd-artwork {
            position: absolute;
            inset: 0;
            background-image: url('noescuches_2_2.webp');
            
            /* Encuadre exacto para que el rostro calce con el agujero central */
            background-size: 98% auto;
            background-position: 50% 62%;
            background-repeat: no-repeat;
            
            /* Filtros CSS que convierten tu foto en serigrafía de alto contraste */
            filter: grayscale(100%) contrast(140%) brightness(90%);
            mix-blend-mode: lighten; /* Funde la imagen con la base negra del CD */
        }

        /* Anillo de policarbonato ahumado (deja ver el collar y la barbilla debajo) */
        #cd-hub {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 26%; height: 26%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); /* Semi-transparente */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.95);
        }

        /* Agujero central del CD */
        #cd-hole {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12%; height: 12%;
            border-radius: 50%;
            background-color: #000;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 0 15px #000;
        }
    </style>
</head>
<body>

    <!-- Estructura limpia del CD sin textos -->
    <div id="cd-container">
        <div id="cd-base">
            <div id="cd-artwork"></div>
            <div id="cd-hub"></div>
            <div id="cd-hole"></div>
        </div>
    </div>

</body>
</html>
