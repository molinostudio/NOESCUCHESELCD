<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No escuches el CD</title>
    <!-- Tipografía recta estilo marcador (correspondiente a la Opción 1) y fuente de reproductor -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Itim&family=Patrick+Hand&family=Shantell+Sans:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #f0f0f0;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Contenedor cuadrado adaptable con perspectiva 3D: garantiza círculo 1:1 en móvil, tablet y desktop */
        #discman-container {
            position: relative;
            width: min(90vw, 90vh, 580px);
            height: min(90vw, 90vh, 580px);
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            perspective: 1300px;
        }

        /* Disco negro mate estilo serigrafía PS1 */
        #cd-disc {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                #161616 0%,
                #0d0d0d 68%,
                #181818 96%,
                #3a3a3a 100%
            );
            /* Borde exterior metálico desgastado característico del disco */
            border: 2px solid rgba(190, 190, 190, 0.42);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 50px rgba(255, 255, 255, 0.05),
                inset 0 0 22px rgba(0, 0, 0, 0.95);
            overflow: hidden;
            z-index: 5;
        }

        /* Ilustración en blanco y negro alto contraste fundida con el disco negro */
        #cd-artwork {
            position: absolute;
            inset: 1.5%;
            border-radius: 50%;
            background-image: url('noescuches_2.webp');
            background-size: 112% auto;
            background-position: 50% 45%;
            background-repeat: no-repeat;
            filter: grayscale(100%) contrast(1.25) brightness(0.96);
            /* Funde suavemente los bordes de la foto hacia el negro del CD para dejar margen limpio al texto */
            -webkit-mask-image: radial-gradient(
                circle at 50% 50%,
                #000 56%,
                rgba(0, 0, 0, 0.78) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 92%
            );
            mask-image: radial-gradient(
                circle at 50% 50%,
                #000 56%,
                rgba(0, 0, 0, 0.78) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 92%
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Capa de textura rayada y desgaste de tinta impresa sobre toda la superficie */
        #cd-grunge {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.36;
            mix-blend-mode: screen;
        }

        /* Aro central de policarbonato oscuro realista (estilo CD PS1) */
        #cd-hub-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28.5%;
            height: 28.5%;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                transparent 42%,
                rgba(10, 10, 10, 0.72) 44%,
                rgba(48, 48, 48, 0.48) 68%,
                rgba(12, 12, 12, 0.85) 95%,
                rgba(170, 170, 170, 0.35) 100%
            );
            border: 1.5px solid rgba(180, 180, 180, 0.32);
            box-shadow:
                inset 0 0 10px rgba(0, 0, 0, 0.9),
                0 0 8px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            z-index: 8;
        }

        /* Segundo anillo interno del eje del CD */
        #cd-hub-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20.5%;
            height: 20.5%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            z-index: 9;
        }

        /* Agujero central negro del CD */
        #cd-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 11.5%;
            height: 11.5%;
            border-radius: 50%;
            background: #000000;
            border: 2px solid rgba(140, 140, 140, 0.35);
            box-shadow: inset 0 0 8px #000, 0 0 6px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 10;
        }

        /* SVG superpuesto con los 6 textos curvos repartidos alrededor del CD */
        #cd-tracks-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            overflow: visible;
        }

        .track-link {
            cursor: pointer;
        }

        .track-text {
            font-family: 'Patrick Hand', 'Itim', 'Shantell Sans', sans-serif;
            font-weight: 400;
            font-size: 24px;
            fill: #f5f5f2;
            /* Contorno sutil oscuro para mantener nitidez sobre zonas claras sin engrosar la letra */
            stroke: #050505;
            stroke-width: 3.5px;
            stroke-linejoin: round;
            paint-order: stroke fill;
            letter-spacing: 0.4px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.95));
            transition: fill 0.25s ease, filter 0.25s ease;
        }

        .track-link:hover .track-text,
        .track-link:focus .track-text,
        .track-link:active .track-text {
            fill: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.85));
        }

        /* Animación de giro del CD al reproducir */
        .spinning {
            animation: spinCD 0.8s linear infinite;
        }

        @keyframes spinCD {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Tapa del Discman (acrílico oscuro translúcido que baja sobre el disco girando) */
        #discman-lid {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 35% 30%,
                rgba(40, 40, 42, 0.68),
                rgba(8, 8, 10, 0.92) 72%,
                #020202 100%
            );
            border: 2px solid #2a2a2a;
            box-shadow:
                inset 0 0 45px rgba(0, 0, 0, 0.95),
                0 20px 50px rgba(0, 0, 0, 0.9);
            transform-origin: top center;
            transform: rotateX(115deg);
            opacity: 0;
            transition: transform 1.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            pointer-events: none;
            z-index: 25;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 11%;
        }

        #discman-lid::after {
            content: "NO ESCUCHES EL CD";
            font-family: 'Courier Prime', monospace;
            font-size: clamp(9px, 2vw, 11px);
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.32);
        }

        .lid-closed {
            transform: rotateX(0deg) !important;
            opacity: 1 !important;
        }

        /* Pantalla de contenido de cada track */
        #content-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.85s ease;
            z-index: 30;
        }

        .show-content {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        #playing-status {
            color: #777;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        #playing-title {
            font-family: 'Patrick Hand', 'Itim', 'Shantell Sans', sans-serif;
            font-size: clamp(36px, 6.5vw, 54px);
            color: #f5f5f2;
            letter-spacing: 1px;
        }

        #playing-subtitle {
            margin-top: 14px;
            color: #888;
            font-size: 14px;
            max-width: 460px;
            line-height: 1.5;
        }

        #stop-btn {
            margin-top: 42px;
            padding: 12px 28px;
            background: transparent;
            color: #f5f5f2;
            border: 1px solid #555;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            letter-spacing: 2px;
            border-radius: 2px;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        #stop-btn:hover,
        #stop-btn:active {
            background: #f5f5f2;
            color: #000000;
            border-color: #f5f5f2;
        }
    </style>
</head>
<body>

    <div id="discman-container">
        <!-- Tapa del reproductor -->
        <div id="discman-lid"></div>

        <!-- CD Negro estilo Serigrafía PS1 -->
        <div id="cd-disc">
            <!-- Imagen central fundida en blanco y negro -->
            <div id="cd-artwork"></div>

            <!-- Textura de rayones y grano serigráfico -->
            <svg id="cd-grunge" viewBox="0 0 500 500" aria-hidden="true">
                <defs>
                    <filter id="ps1-grain">
                        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="14" result="noise" />
                        <feColorMatrix type="matrix" values="
                            0 0 0 0 0.85
                            0 0 0 0 0.85
                            0 0 0 0 0.85
                            0 0 0 0.22 0" />
                    </filter>
                    <clipPath id="disc-clip">
                        <circle cx="250" cy="250" r="248" />
                    </clipPath>
                </defs>
                <g clip-path="url(#disc-clip)">
                    <rect width="500" height="500" filter="url(#ps1-grain)" />
                    <!-- Rayones sutiles en el borde oscuro -->
                    <path d="M 85 95 Q 140 55 210 38" stroke="rgba(255,255,255,0.22)" stroke-width="1" fill="none" />
                    <path d="M 330 455 Q 395 425 435 375" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" fill="none" />
                    <path d="M 35 280 Q 45 340 78 390" stroke="rgba(255,255,255,0.16)" stroke-width="0.9" fill="none" />
                    <path d="M 425 115 Q 455 160 468 215" stroke="rgba(255,255,255,0.18)" stroke-width="1" fill="none" />
                </g>
            </svg>

            <!-- Aro plástico y agujero central -->
            <div id="cd-hub-outer"></div>
            <div id="cd-hub-inner"></div>
            <div id="cd-hole"></div>

            <!-- 6 Textos curvos repartidos 360° alrededor del CD (todos orientados al derecho para máxima lectura) -->
            <svg id="cd-tracks-svg" viewBox="0 0 500 500" role="navigation" aria-label="Menú principal del CD">
                <defs>
                    <!-- Arco superior (sentido horario): para los 3 títulos de la mitad superior -->
                    <path id="arc-top" d="M 250, 456 A 206,206 0 1,1 250, 44 A 206,206 0 1,1 250, 456" />
                    <!-- Arco inferior (sentido antihorario): mantiene los 3 títulos inferiores al derecho y legibles -->
                    <path id="arc-bottom" d="M 250, 38 A 212,212 0 1,0 250, 462 A 212,212 0 1,0 250, 38" />
                </defs>

                <!-- 12:00 - Arriba al centro -->
                <g class="track-link" tabindex="0" role="button" aria-label="Teaser" onclick="playTrack('Teaser')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="50%" text-anchor="middle">Teaser</textPath>
                    </text>
                </g>

                <!-- 10:00 - Arriba a la izquierda -->
                <g class="track-link" tabindex="0" role="button" aria-label="Peter Pank" onclick="playTrack('Peter Pank')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="32%" text-anchor="middle">Peter Pank</textPath>
                    </text>
                </g>

                <!-- 02:00 - Arriba a la derecha -->
                <g class="track-link" tabindex="0" role="button" aria-label="Literatura" onclick="playTrack('Literatura')">
                    <text>
                        <textPath class="track-text" href="#arc-top" startOffset="68%" text-anchor="middle">Literatura</textPath>
                    </text>
                </g>

                <!-- 08:00 - Abajo a la izquierda -->
                <g class="track-link" tabindex="0" role="button" aria-label="Fanzines" onclick="playTrack('Fanzines')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="31.5%" text-anchor="middle">Fanzines</textPath>
                    </text>
                </g>

                <!-- 04:00 - Abajo a la derecha -->
                <g class="track-link" tabindex="0" role="button" aria-label="Música" onclick="playTrack('Música')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="68.5%" text-anchor="middle">Música</textPath>
                    </text>
                </g>

                <!-- 06:00 - Abajo al centro -->
                <g class="track-link" tabindex="0" role="button" aria-label="No escuches el CD - Film" onclick="playTrack('No escuches el CD - Film')">
                    <text>
                        <textPath class="track-text" href="#arc-bottom" startOffset="50%" text-anchor="middle">No escuches el CD - Film</textPath>
                    </text>
                </g>
            </svg>
        </div>
    </div>

    <!-- Pantalla de contenido al abrir un track -->
    <div id="content-screen">
        <p id="playing-status">▶ TRACK EN REPRODUCCIÓN</p>
        <h1 id="playing-title">Teaser</h1>
        <p id="playing-subtitle">Aquí desplegaremos el contenido interactivo de esta sección.</p>
        <button id="stop-btn" onclick="stopDisc()">◼ EJECT</button>
    </div>

    <script>
        const cd = document.getElementById('cd-disc');
        const cdArtwork = document.getElementById('cd-artwork');
        const lid = document.getElementById('discman-lid');
        const contentScreen = document.getElementById('content-screen');
        const playingTitle = document.getElementById('playing-title');
        let isTransitioning = false;

        // Respaldo automático de imagen por si el archivo local tiene otro nombre
        (function ensureArtworkLoads() {
            const candidates = ['noescuches_2.webp', 'noescuches.webp', 'image_0caa4e.png', 'image_0e6296.png'];
            let index = 0;

            function tryNext() {
                if (index >= candidates.length) return;
                const img = new Image();
                const currentSrc = candidates[index++];
                img.onload = () => {
                    cdArtwork.style.backgroundImage = `url('${currentSrc}')`;
                };
                img.onerror = tryNext;
                img.src = currentSrc;
            }

            tryNext();
        })();

        // Soporte de teclado (Enter / Espacio) en los enlaces SVG
        document.querySelectorAll('.track-link').forEach((item) => {
            item.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const label = item.getAttribute('aria-label');
                    if (label) playTrack(label);
                }
            });
        });

        function playTrack(trackName) {
            if (isTransitioning) return;
            isTransitioning = true;

            // 1. El CD comienza a girar
            cd.classList.add('spinning');

            // 2. Baja la tapa acrílica del Discman
            setTimeout(() => {
                lid.classList.add('lid-closed');
            }, 400);

            // 3. Muestra la sección elegida
            playingTitle.innerText = trackName;

            setTimeout(() => {
                contentScreen.classList.add('show-content');
                isTransitioning = false;
            }, 1850);
        }

        function stopDisc() {
            if (isTransitioning) return;
            isTransitioning = true;

            contentScreen.classList.remove('show-content');

            setTimeout(() => {
                lid.classList.remove('lid-closed');

                setTimeout(() => {
                    cd.classList.remove('spinning');
                    isTransitioning = false;
                }, 850);
            }, 550);
        }
    </script>
</body>
</html>
